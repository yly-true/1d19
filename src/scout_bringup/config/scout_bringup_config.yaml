# 建图、导航及 CAN 启动配置；修改后重新启动对应 launch。

common:
  use_sim_time: false
  rviz: true

mapping:
  resolution: 0.05
  publish_period_sec: 1.0

navigation:
  map: ld19_handheld_map.yaml

scout_can:
  interface_name: can0
  send_control: true
  use_cmd_vel: false
  cmd_vel_timeout_ms: 500
  publish_odom: false
  log_frames: true
  send_period_ms: 20
  control_vx_mm_s: 0
  control_wz_mrad_s: 0
  control_vy_mm_s: 0
  odom_frame: odom
  base_frame: base_link
  # 仅校准反馈，不改变控制指令；系数 = 实际位移 / 原始里程计位移。
  odom_vx_scale: 1.0
  odom_vy_scale: 1.0
  odom_wz_scale: 1.0
  # 校准后速度的标准差（m/s、m/s、rad/s），初始估计，需实测调整。
  odom_vx_stddev: 0.03
  odom_vy_stddev: 0.06
  odom_wz_stddev: 0.03
  odom_timeout_sec: 0.2
